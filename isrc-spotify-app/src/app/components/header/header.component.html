<header class="header">
  <div class="header__background"></div>
  <div class="header__container">
    <div class="header__content">
      <div class="header__brand">
        <div class="header__logo">
          <i class="fas fa-check" style="font-size: 32px; color: white"></i>
        </div>
        <div class="header__text">
          <h1 class="header__title">{{ 'header.title' | translate }}</h1>
          <p class="header__subtitle">{{ 'header.subtitle' | translate }}</p>
        </div>
      </div>
      <div class="header__actions">
        <app-language-selector></app-language-selector>
        <div class="header__powered">
          {{ 'header.poweredBy' | translate }} <strong>Spotify API</strong>
        </div>
      </div>
    </div>
  </div>
</header>
