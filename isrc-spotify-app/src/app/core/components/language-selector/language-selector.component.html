<div class="language-selector" (click)="$event.stopPropagation()">
  <!-- Botão principal -->
  <button
    class="language-selector__trigger"
    (click)="toggleDropdown()"
    [class.active]="isOpen()"
    type="button"
    aria-label="Selecionar idioma"
  >
    <div class="language-info">
      <span class="flag">{{ getCurrentLanguageInfo().flag }}</span>
      <span class="code">{{ getCurrentLanguageInfo().code.toUpperCase() }}</span>
    </div>
    <i
      class="fas fa-chevron-down chevron"
      [class.rotated]="isOpen()"
      style="font-size: 16px; color: white"
    ></i>
  </button>

  <!-- Dropdown -->
  @if (isOpen()) {
  <div class="language-selector__dropdown">
    <div class="dropdown-content">
      @for (language of supportedLanguages; track language) {
      <button
        class="language-option"
        [class.active]="isCurrentLanguage(language)"
        (click)="selectLanguage(language)"
        type="button"
      >
        <div class="language-info">
          <span class="flag">{{ getLanguageInfo(language).flag }}</span>
          <span class="name">{{ getLanguageInfo(language).name }}</span>
        </div>
        @if (isCurrentLanguage(language)) {
        <i class="fas fa-check check-icon" style="font-size: 16px; color: #1db954"></i>
        }
      </button>
      }
    </div>
  </div>
  }

  <!-- Backdrop para fechar ao clicar fora -->
  @if (isOpen()) {
  <div class="language-selector__backdrop" (click)="closeDropdown()"></div>
  }
</div>
