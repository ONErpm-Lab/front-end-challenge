<div class="player__backdrop" [style.background-image]="background()" aria-hidden="true"></div>
<button
  #closeButton
  type="button"
  class="player__close"
  [attr.aria-label]="'Fechar o player do Spotify de &quot;' + title() + '&quot;'"
  (click)="close()"
>
  <app-icon name="close" [size]="18" />
</button>
@if (phase() === 'open') {
  <app-spotify-embed
    class="player__embed"
    [url]="url()"
    [title]="title()"
    [height]="embedHeight()"
  />
  <div class="player__footer"><ng-content /></div>
}
