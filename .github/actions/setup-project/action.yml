name: Setup project
description: Node from .nvmrc, the npm version pinned in package.json, and a cached `npm ci`.

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    # npm 11.4 (bundled with early Node 24) fails with "Cannot read properties of null (reading 'edgesOut')".
    - name: Pin npm to the packageManager version
      shell: bash
      run: npm install -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

    - name: Install dependencies
      shell: bash
      env:
        HUSKY: '0'
      run: npm ci
