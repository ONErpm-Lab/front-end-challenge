# Pipeline de integração contínua: roda em todo push e pull request.
# Cada verificação é um passo separado, para o PR mostrar exatamente o que falhou
# (arquitetura, estilo, testes/cobertura ou build).
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Um novo push na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Fronteiras de arquitetura
        run: npm run lint:boundaries

      - name: Lint
        run: npm run lint

      - name: Testes + cobertura (≥ 90% na lógica pura)
        run: npm run test:coverage

      - name: Build de produção
        run: npm run build

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: ignore

  api:
    name: API (BFF)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes + cobertura (≥ 90% na regra de negócio)
        run: npm run test:coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: api/coverage
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright, API em modo mock)
    # Só roda se as verificações rápidas passarem: E2E é o passo mais caro.
    needs: [frontend, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json

      - name: Instalar dependências (API e frontend)
        run: |
          npm ci --prefix api
          npm ci --prefix frontend

      - name: Instalar o Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (desktop e mobile)
        working-directory: frontend
        run: npm run e2e

      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
