name: Release

# A release is created by hand on GitHub (Releases → Draft a new release → a new tag `vX.Y.Z` on main →
# Publish). Publishing it deploys that tag to Vercel and publishes its container image. A merge to main, or a
# release that is only a draft, deploys nothing. See ADR 0020, ADR 0021 and ADR 0022.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Deploy an existing release tag (for example v1.2.3) again, without a new release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The site: built and deployed to Vercel from the tag, as the production deployment.
  vercel:
    name: Deploy to Vercel
    # A pre-release (v1.2.3-rc.1) is not deployed; a tag chosen by hand always is.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # From `.vercel/project.json`, after `vercel link` (they are identifiers, not secrets).
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI: vercel@65.2.0
    steps:
      - name: Check the tag is a release tag
        run: |
          # The whole value, not line by line: a tag with a line break must not slip through.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-project

      # The token (read from the environment by the CLI, so it is never on a command line) is given only to the
      # two steps that talk to Vercel. The build runs the project's own code and does not get it.
      - name: Pull the production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production

      - name: Build for production
        run: npx --yes "$VERCEL_CLI" build --prod

      - name: Deploy the build to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "$VERCEL_CLI" deploy --prebuilt --prod

  # The same app as a portable container image (ADR 0020), for any host that runs images.
  image:
    name: Container image of the release
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag is a release tag
        run: |
          # The whole value, not line by line: a tag with a line break must not slip through.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z)"
            exit 1
          fi

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 gives the tags 1.2.3, 1.2 and latest.
      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
