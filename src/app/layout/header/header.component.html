<header class="header">
  <div class="inner">
    <a class="brand" href="/">
      <span class="brand__mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 26 26">
          <rect x="2" y="12" width="3.5" height="10" rx="1.5" />
          <rect x="8" y="6" width="3.5" height="16" rx="1.5" />
          <rect x="14" y="2" width="3.5" height="20" rx="1.5" />
          <rect x="20" y="9" width="3.5" height="13" rx="1.5" />
        </svg>
      </span>
      <span class="brand__name">{{ 'app.productName' | transloco }}</span>
    </a>

    <nav class="crumbs" [attr.aria-label]="'app.breadcrumb' | transloco">
      <ol>
        <li>
          <orp-icon name="chevron-right" [size]="14" />
          <span>{{ 'app.contracts' | transloco }}</span>
        </li>
        <li aria-current="page">
          <orp-icon name="chevron-right" [size]="14" />
          <span>{{ 'app.producerContract' | transloco }}</span>
        </li>
      </ol>
    </nav>

    <div class="tools">
      <orp-language-menu />
      <orp-theme-toggle />
    </div>
  </div>
</header>
