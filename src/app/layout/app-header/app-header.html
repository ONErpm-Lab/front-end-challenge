<header class="header">
  <div class="header__inner">
    <span class="brand">
      <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect class="bar bar--1" x="2" y="8" width="4" height="12" rx="2" />
        <rect class="bar bar--2" x="8" y="3" width="4" height="17" rx="2" />
        <rect class="bar bar--3" x="14" y="6" width="4" height="14" rx="2" />
        <rect class="bar bar--4" x="20" y="10" width="3" height="10" rx="1.5" />
      </svg>
      <span class="brand__name">{{ 'app.eyebrow' | transloco }}</span>
    </span>

    <div class="actions">
      <orp-language-select />
      <orp-theme-toggle />
    </div>
  </div>
</header>
